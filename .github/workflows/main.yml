name: CI tests

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  build:
    # ubuntu-latest is 26.04 now, where setup-ruby cannot install Ruby 3.3.9.
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.0'
          - '3.1'
          - '3.3.9'

    steps:
    - uses: actions/checkout@v7
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - name: Run the default task
      run: bundle exec rake
